services:
  - type: web
    name: flow-agent-retail-ad-review-adapters
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/healthz
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: TASK_PLATFORM_API_BASE_URL
        value: https://task-platform-staging.nodesk.tech/api/platform
      - key: TASK_PLATFORM_TOKEN
        sync: false
